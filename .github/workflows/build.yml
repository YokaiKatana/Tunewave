name: Build & release

# Every push to main builds the Windows app.
# If package.json has a version that hasn't been released yet, a GitHub Release
# "vX.Y.Z" is created with the installer and the portable zip attached.
# To publish an update: bump "version" in package.json and push.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; this run only builds test files."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build installer + portable zip
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build files (on the Actions run page)
        uses: actions/upload-artifact@v4
        with:
          name: Tunewave-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/Tunewave-Setup-*.exe
            dist/Tunewave-Portable-*.zip

      - name: Publish GitHub Release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Tunewave ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Download for Windows
            - **Installer:** `Tunewave-Setup-${{ steps.ver.outputs.version }}.exe` installs Tunewave with Start menu and desktop shortcuts.
            - **Portable:** `Tunewave-Portable-${{ steps.ver.outputs.version }}-Windows.zip` needs no install. Unzip it and run `Tunewave.exe`.

            The installed version updates itself automatically from now on. The portable version tells you when a new release is out.

            Windows may show "Windows protected your PC" because the app isn't code-signed. Click **More info → Run anyway**.
          files: |
            dist/Tunewave-Setup-*.exe
            dist/Tunewave-Setup-*.exe.blockmap
            dist/Tunewave-Portable-*.zip
            dist/latest.yml
