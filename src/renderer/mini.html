<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Tunewave Mini</title>
  <link rel="stylesheet" href="mini.css" />
</head>
<body>
  <div id="mini-root" class="no-track">
    <button class="back winbtn" id="mini-back" title="Back to full player" data-icon="openFull"></button>
    <div class="winctl">
      <button class="winbtn" id="mini-min" title="Minimise" data-icon="minimise"></button>
      <button class="winbtn close" id="mini-exit" title="Back to full player" data-icon="close"></button>
    </div>

    <div class="m-art-wrap"><img id="m-art" alt="" /><div class="m-art-ph" data-icon="note"></div></div>
    <div class="m-info">
      <div id="m-title" class="m-title">Nothing playing</div>
      <div id="m-artist" class="m-artist"></div>
    </div>
    <div class="m-progress"><div class="m-fill"></div></div>
    <div class="m-controls">
      <button class="icon-btn" data-mcmd="prev" data-icon="prev" title="Previous"></button>
      <button class="play-btn" id="m-play" data-mcmd="playPause" data-icon="play" title="Play"></button>
      <button class="icon-btn" data-mcmd="next" data-icon="next" title="Next"></button>
      <button class="icon-btn like-btn" id="m-like" data-mcmd="like" data-icon="heartOutline" title="Like"></button>
    </div>
  </div>
  <script src="themes.js"></script>
  <script src="icons.js"></script>
  <script src="mini.js"></script>
</body>
</html>
